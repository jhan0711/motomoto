name: CI

# Se ejecuta en cada push y en cada pull request. La rama principal es `main`.
on:
  push:
  pull_request:

# Un push nuevo sobre la misma rama cancela la corrida anterior: no tiene sentido
# gastar minutos en un commit que ya quedo atras.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  EXPO_NO_TELEMETRY: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Cliente movil (Expo). Comprobaciones rapidas, sin secretos.
  # ---------------------------------------------------------------------------
  movil:
    name: Cliente movil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `expo-env.d.ts` esta en .gitignore (lo pide Expo) y `tsconfig.json` lo
      # incluye. Sin el, `tsc` no encuentra los tipos de `expo/types`. Su
      # contenido es una sola linea fija, asi que se recrea aqui en vez de
      # arrancar Metro solo para generarlo.
      - name: Preparar tipos de Expo
        run: echo '/// <reference types="expo/types" />' > expo-env.d.ts

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

  # ---------------------------------------------------------------------------
  # Panel administrativo (Next.js). Proyecto aparte, con su propio lock y su
  # propio Prettier. No tiene Jest todavia (ver seccion 15.25): se cubre con
  # typecheck, lint, formato y la compilacion, que en Next atrapa bastante.
  # ---------------------------------------------------------------------------
  panel:
    name: Panel administrativo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

      # La compilacion solo necesita que las variables existan: los valores
      # reales importan en ejecucion, no al construir. Si estan como secretos se
      # usan; si no, un marcador que deja compilar igual.
      - name: Compilar
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder' }}

  # ---------------------------------------------------------------------------
  # Regresion de base de datos: los 34 prueba_*.sql y los 2 .mjs contra el
  # servidor de desarrollo. Necesita secretos; si no estan configurados, el
  # trabajo pasa en verde con un aviso en lugar de bloquear el CI.
  # ---------------------------------------------------------------------------
  regresion-bd:
    name: Regresion de base de datos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que hay secretos
        id: guard
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN. Se omite la regresion de base de datos." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - if: steps.guard.outputs.run == 'true'
        run: npm ci

      # Los .mjs leen `.env` del disco (EXPO_PUBLIC_SUPABASE_URL y la clave
      # publicable). La clave publicable no es secreta -viaja en el paquete de la
      # app- pero se guarda como secreto de repositorio por uniformidad.
      - if: steps.guard.outputs.run == 'true'
        name: Escribir .env
        run: |
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}"
          } > .env

      - if: steps.guard.outputs.run == 'true'
        name: Enlazar el proyecto
        run: npx supabase link --project-ref bosodjcehvqmmegxdmlu
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - if: steps.guard.outputs.run == 'true'
        name: Correr la regresion
        run: npm run test:db
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
